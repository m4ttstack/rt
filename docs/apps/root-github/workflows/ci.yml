name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      # Checked out as SIBLINGS because package.json reaches rt-client through
      # `file:../repo-tools/packages/rt-client`; a lone checkout cannot resolve
      # that path, and install fails before any gate gets to run.
      - uses: actions/checkout@v4
        with:
          path: console
      - uses: actions/checkout@v4
        with:
          repository: m4ttstack/rt
          path: repo-tools
      - uses: oven-sh/setup-bun@v2
      # rt-client's dist/ is gitignored and `file:` consumers copy it verbatim,
      # so it must be built here or the console installs an empty package.
      #
      # --ignore-scripts is load-bearing on BOTH installs: rt-client's `prepack`
      # runs its build, which bun fires during install, before @types/node and
      # @types/bun are in place — so the build must be an explicit step between
      # the two installs, never a lifecycle hook during either.
      - run: bun install --ignore-scripts
        working-directory: repo-tools
      - run: bun run build
        working-directory: repo-tools/packages/rt-client
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test -- --run
      - run: bun run build
      - run: bun run build-storybook
      - run: bun run debrand
      - run: bun run treeshake
      - run: bun run build:binary
      # The binary embeds its own assets, so the only honest test is to run it
      # where `dist/` is not: a binary built without the codegen step falls back
      # to disk mode and 404s every page, which passes silently anywhere the
      # source tree happens to be sitting next to it.
      - name: the binary serves its own assets with no source tree
        run: |
          set -euo pipefail
          cp dist-bin/console "$RUNNER_TEMP/console"
          mv dist dist-hidden
          cd "$RUNNER_TEMP"
          PORT=11099 ./console &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -m 1 localhost:11099/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -m 5 localhost:11099/api/health >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:11099/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:11099/search)" = 200
          asset=$(curl -s localhost:11099/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$asset"
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:11099$asset")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:11099/fonts/tomorrow-400.woff2)" = 200
