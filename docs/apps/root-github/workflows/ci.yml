name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    # Read-only, and no git credentials left in .git/config after checkout:
    # nothing downstream authenticates to git.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test -- --run
      - run: bun run build
      - run: bun run debrand
      - run: bun run treeshake

      # Console proves its compiled binary serves its own embedded assets.
      # chat ships no binary (deck supervises the process), so the equivalent
      # gate is that the BUILT CLIENT is served and `/api` is not swallowed by
      # the SPA fallback: an unmatched /api route must be a JSON 404, because
      # an RPC client checks res.ok and would otherwise throw parsing HTML.
      # That is the exact trap static-disk.ts exists to avoid.
      - name: the server serves the built client, and /api is not the SPA
        run: |
          set -euo pipefail
          PORT=11123 bun src/server/index.ts &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS -m 1 localhost:11123/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -m 5 localhost:11123/api/health >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:11123/)" = 200
          test "$(curl -s -o /dev/null -w '%{content_type}' localhost:11123/)" = "text/html; charset=utf-8"
          asset=$(curl -s localhost:11123/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$asset"
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:11123$asset")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:11123/api/does-not-exist)" = 404
          test "$(curl -s -o /dev/null -w '%{content_type}' localhost:11123/api/does-not-exist)" = "application/json"
