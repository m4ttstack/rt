name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      # Checked out as SIBLINGS because package.json reaches rt-client through
      # `file:../repo-tools/packages/rt-client`; a lone checkout cannot resolve
      # that path, and install fails before any gate gets to run.
      - uses: actions/checkout@v4
        with:
          path: console
      - uses: actions/checkout@v4
        with:
          repository: m4ttstack/rt
          path: repo-tools
      - uses: oven-sh/setup-bun@v2
      # rt-client's dist/ is gitignored and `file:` consumers copy it verbatim,
      # so it must be built here or the console installs an empty package.
      # Install at the workspace ROOT, not in the package: rt-client's own
      # build runs tsc, and @types/node and @types/bun are hoisted to the root
      # — a package-scoped install resolves two packages and then fails.
      - run: bun install
        working-directory: repo-tools
      - run: bun run build
        working-directory: repo-tools/packages/rt-client
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test -- --run
      - run: bun run build
      - run: bun run build-storybook
      - run: bun run debrand
      - run: bun run treeshake
