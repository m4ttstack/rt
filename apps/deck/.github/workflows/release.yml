# Release artifact contract (mattstack distribution, installer lane L5): each
# vX.Y.Z tag publishes a GitHub Release carrying the raw bun-compiled
# darwin-arm64 binary plus its sha256. The bundle pipeline PULLS these; the
# rt-tray deps.lock row is asserted against `deck --version`, so the tag, the
# package.json version, and the binary's own output must all agree — the
# version-check step fails the release rather than publish a mismatched
# artifact.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG" >&2
            exit 1
          fi
      - run: bun test core src
      - run: bun run build
      - name: binary reports the released version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          OUT="$(./dist/deck --version)"
          if [ "$OUT" != "$TAG" ]; then
            echo "deck --version printed '$OUT', expected '$TAG'" >&2
            exit 1
          fi
      - name: package artifacts
        run: |
          cp dist/deck deck-darwin-arm64
          shasum -a 256 deck-darwin-arm64 > deck-darwin-arm64.sha256
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "deck $GITHUB_REF_NAME" \
            --notes "bun-compiled darwin-arm64 deck binary. Verify: shasum -a 256 -c deck-darwin-arm64.sha256" \
            deck-darwin-arm64 deck-darwin-arm64.sha256
