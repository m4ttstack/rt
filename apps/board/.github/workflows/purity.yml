name: Repo purity

# board is a public merge-request dashboard. This gate keeps employer,
# customer, and internal-system references out of the tracked tree on every PR
# and every push to main. It exists because the bar was crossed once: the
# capture fixture was a verbatim snapshot of a real private board, and the
# committed baseline PNGs rendered every real name in it. A word list cannot
# certify what it was never told to look for, so extend
# scripts/repo-purity.sh when a new term appears.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No employer or domain references in the tracked tree
        run: scripts/repo-purity.sh
