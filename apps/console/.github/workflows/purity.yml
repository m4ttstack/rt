name: Repo purity

# console is a public, general-purpose developer tool. This gate keeps
# employer, customer, and internal-system references out of the tracked tree
# on every PR and every push to main -- extend scripts/repo-purity.sh when a
# new term appears.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No employer or domain references in the tracked tree
        run: scripts/repo-purity.sh
