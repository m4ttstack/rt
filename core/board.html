<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck</title>
<link rel="stylesheet" href="/vendor/oat.min.css">
<style>
  [x-cloak] { display: none !important; }

  .board {
    width: min(100% - (2 * var(--space-4)), 96rem);
    margin-inline: auto;
  }
  td {
    white-space: nowrap;
    vertical-align: middle;
  }
  input.port-edit {
    display: inline-block;
    width: 6.5rem;
    margin: 0;
  }
  /* A vstack stretches its children; badges should hug their text instead. */
  .devport-stack {
    align-items: flex-start;
  }
  /* Secondary to the port control it sits beside, not a peer of it. */
  .devport-public {
    font-size: 0.8em;
    gap: var(--space-2);
  }
  /* hstack is a block-level flex container, so a chip after the name would be
     pushed onto its own line and stand the row up taller. */
  .site-name {
    display: inline-flex;
    vertical-align: middle;
  }
  /* Quiet micro-label for facts that annotate a row rather than compete with
     it: which port is an override, who owns a row's structure. Deliberately
     not a .badge, which is a filled pill and reads as loud as the app name. */
  .chip {
    margin-left: var(--space-2);
    font-size: 0.7em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: help;
  }
  .devport-line {
    flex-wrap: nowrap;
  }
  /* Out of flow, not merely transparent. This is a table: a cell wide enough
     to hold these controls at rest widens the whole column, and the width it
     takes comes straight out of the access column, which then wraps and makes
     every row in the table taller. Absolute keeps the column sized to the port
     itself; the cell below is the positioning context. */
  .devport-extra {
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: var(--space-2);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-fast);
  }
  .devport-line {
    position: relative;
  }
  tr:hover .devport-extra,
  .devport-extra:focus-within {
    opacity: 1;
    pointer-events: auto;
  }
  /* Every compact button gets the same box. A button is a flex container, so
     an icon-only one is sized by its 14px glyph rather than by the 18px line
     box its text siblings get, and comes out 4px shorter for no reason the
     reader can see. Oat's .icon class is not the answer here: it fixes the
     width but zeroes the padding, which is what left these cramped (see the
     breathing-room test in core/board-assets.test.ts). */
  button.small {
    min-height: 1.75rem;
  }
  /* td is nowrap for port numbers; a config line has to be free to wrap. */
  .preflight-issue {
    white-space: normal;
    max-width: 22rem;
    align-items: flex-start;
  }
  .preflight-issue code {
    font-size: 0.75em;
    white-space: normal;
    word-break: break-word;
  }
  /* Oat ships mb-2/4/6/8 but not mb-0. The access dialog pairs a [data-field]
     with a button on the same line, and [data-field]'s own bottom margin
     would otherwise misalign the two. */
  .mb-0 {
    margin-block-end: 0;
  }
</style>
</head>
<body>
<main class="board" x-data="board" x-cloak>

  <header class="hstack justify-between">
    <h1>Deck</h1>
    <span class="hstack gap-2" x-show="data && data.canManage">
      <button type="button" class="small outline"
              :disabled="reloadingProxy"
              @click="onProxyReload()">
        <span x-show="reloadingProxy" aria-busy="true" data-spinner="small" aria-hidden="true"></span>
        <span x-text="reloadingProxy ? 'restarting…' : 'reload proxy'"></span>
      </button>
      <button type="button" class="small"
              @click="addModal = { name: '', external: false, command: '', workingDirectory: '', staticPort: '', error: null }">
        <i data-lucide="plus"></i> add app
      </button>
    </span>
  </header>
  <p class="text-light mb-6" x-text="subline"></p>

  <div role="alert" class="flex-col mb-6"
       x-show="proxyNotice"
       :data-variant="proxyNotice && proxyNotice.kind === 'ok' ? 'success' : 'error'">
    <span x-text="proxyNotice ? proxyNotice.message : ''"></span>
    <pre x-show="proxyNotice && proxyNotice.command"
         x-text="proxyNotice ? proxyNotice.command : ''"></pre>
  </div>

  <template x-for="section in sections" :key="section.key">
    <section :class="section.title ? 'mt-6' : ''">
      <h2 x-show="section.title" x-text="section.title"></h2>
      <div class="table">
        <table>
          <thead x-show="section.key === 'apps'">
            <tr>
              <th>site</th>
              <th>port</th>
              <th>health</th>
              <th>launchd</th>
              <th>public</th>
              <th>access</th>
              <th aria-label="actions"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in section.rows" :key="row.name">
              <tr>
                <td>
                  <template x-if="row.url">
                    <span class="hstack gap-1 site-name">
                      <a class="unstyled" :href="row.url">
                        <strong x-text="row.name"></strong><span class="text-light" x-text="'.' + data.suffix"></span>
                      </a>
                      <a x-show="row.publicUrl && row.publicUrl !== row.url"
                         :class="row.published ? 'text-light' : 'text-lighter'"
                         :href="row.publicUrl"
                         target="_blank"
                         rel="noopener"
                         :aria-label="row.published ? 'open ' + String(row.publicUrl).replace('https://', '') : 'private — not publicly reachable'"
                         :title="row.published ? 'open ' + String(row.publicUrl).replace('https://', '') : 'private — not publicly reachable'">
                        <i data-lucide="external-link"></i>
                      </a>
                    </span>
                  </template>
                  <template x-if="!row.url">
                    <span class="text-light" x-text="row.name"></span>
                  </template>
                  <!-- Who owns this row's structure belongs with the row's
                       identity, not in the column of things you can click. -->
                  <template x-if="isPlatform(row.managedBy)">
                    <span class="chip text-light" aria-label="this is Deck itself, `deck uninstall` to remove it"
                          title="this is Deck itself, `deck uninstall` to remove it">this board</span>
                  </template>
                  <template x-if="row.managedBy && row.managedBy !== 'user' && !isPlatform(row.managedBy)">
                    <span class="chip text-light" :aria-label="'structure is owned by ' + row.managedBy"
                          :title="'structure is owned by ' + row.managedBy"
                          x-text="'managed · ' + row.managedBy"></span>
                  </template>
                  <template x-for="issue in (row.issues || [])" :key="issue.source">
                    <span class="vstack gap-1 preflight-issue">
                      <span class="badge" data-variant="danger">
                        <i data-lucide="triangle-alert"></i>
                        <span x-text="issue.source + ' sync failed'"></span>
                      </span>
                      <code class="text-light" x-text="issue.message"></code>
                    </span>
                  </template>
                </td>

                <td>
                  <template x-if="editing && editing.app === row.name">
                    <span>
                      <s x-show="row.override" class="text-light"
                         x-text="row.override ? row.override.basePort : ''"></s>
                      <input class="port-edit"
                             x-model="editing.value"
                             x-init="$el.focus()"
                             placeholder="dev port"
                             inputmode="numeric"
                             aria-label="development port"
                             @keydown.enter="submitPort()"
                             @keydown.escape="cancelEdit()"
                             @blur="cancelEdit()">
                    </span>
                  </template>
                  <template x-if="!(editing && editing.app === row.name)">
                    <span>
                      <template x-if="row.override && data.canManage && !row.self">
                        <span class="vstack gap-1 devport-stack">
                          <span class="hstack gap-2 devport-line">
                            <!-- The live port alone, at the same offset as every
                                 other row's port: no leading glyph, no struck
                                 base port. The override reads from the chip, and
                                 the base port it replaced rides that chip's
                                 title, so this column stays a column of ports. -->
                            <button type="button"
                                    class="small ghost"
                                    @click="startEdit(row)"
                                    aria-label="change development port"
                                    x-text="row.port"></button>
                            <span class="chip text-light"
                                  :title="'dev port override, normally ' + row.override.basePort">dev</span>
                            <!-- Revert and the public-too switch ride this same
                                 line, revealed on row hover or keyboard focus,
                                 so an overridden row is exactly as tall as the
                                 rest of the table. -->
                            <span class="hstack gap-2 devport-extra">
                              <button type="button"
                                      class="small ghost"
                                      @click="clearPort(row)"
                                      :aria-label="'revert to ' + row.override.basePort"
                                      :title="'revert to ' + row.override.basePort">
                                <i data-lucide="rotate-ccw"></i>
                              </button>
                              <label class="hstack gap-2 devport-public"
                                     :title="row.publicFollowsOverride
                                       ? 'the public URL serves the dev port — click to pin it back to ' + row.override.basePort
                                       : 'the public URL serves ' + row.override.basePort + ' — click to serve the dev port instead'">
                                <input type="checkbox"
                                       role="switch"
                                       :checked="row.publicFollowsOverride"
                                       @change="onPublicFollows(row)"
                                       :aria-label="row.publicFollowsOverride
                                         ? 'stop serving ' + row.name + ' dev port publicly'
                                         : 'serve ' + row.name + ' dev port publicly'">
                                <span class="text-light">public too</span>
                              </label>
                            </span>
                          </span>
                          <!-- Preflight is probed only for opted-in apps, so a
                               non-null value means this row is actually exposed. -->
                          <template x-for="issue in (row.preflight || [])" :key="issue.code">
                            <span class="vstack gap-1 preflight-issue">
                              <span class="badge" data-variant="warning">
                                <i data-lucide="triangle-alert"></i>
                                <span x-text="issue.message"></span>
                              </span>
                              <!-- The fix is the point of the check, so it is
                                   shown rather than hidden behind a tooltip. -->
                              <code x-show="issue.fix" x-text="issue.fix" class="text-light"></code>
                            </span>
                          </template>
                          <template x-if="row.preflight && row.preflight.length === 0">
                            <span class="badge" data-variant="success" title="the dev server accepts the public hostname and its hot reload reaches the tunnel">
                              <i data-lucide="circle-check"></i>
                              live publicly
                            </span>
                          </template>
                        </span>
                      </template>
                      <template x-if="!row.override && row.port != null && data.canManage && !row.self">
                        <button type="button"
                                class="small ghost"
                                @click="startEdit(row)"
                                aria-label="change development port"
                                x-text="row.port"></button>
                      </template>
                      <template x-if="!(data.canManage && !row.self && (row.override || row.port != null))">
                        <span class="text-light" x-text="row.port != null ? row.port : '—'"></span>
                      </template>
                    </span>
                  </template>
                </td>

                <td>
                  <template x-if="isRestarting(row)">
                    <span class="badge" data-variant="warning">
                      <span aria-busy="true" data-spinner="small" aria-hidden="true"></span>
                      restarting…
                    </span>
                  </template>
                  <template x-if="!isRestarting(row)">
                    <span class="hstack gap-1">
                      <template x-if="!row.health">
                        <span class="text-light">no route</span>
                      </template>
                      <template x-if="row.health && row.health.status === null">
                        <span class="badge" data-variant="danger" title="no response">unreachable</span>
                      </template>
                      <template x-if="row.health && row.health.status !== null">
                        <span class="badge"
                              :data-variant="row.health.ok ? 'success' : 'danger'"
                              :title="'HTTP ' + row.health.status">
                          <span x-text="row.health.status"></span>
                          <span x-text="row.health.ms + 'ms'"></span>
                        </span>
                      </template>
                      <template x-if="row.service && row.service.stderr && row.service.stderr.length">
                        <span>
                          <button type="button"
                                  class="small ghost"
                                  @click="$el.nextElementSibling.showModal()"
                                  :aria-label="'show recent stderr for ' + row.name">
                            <i data-lucide="file-warning"></i>
                          </button>
                          <dialog data-stderr closedby="any">
                            <header>
                              <h3>recent stderr</h3>
                              <p x-text="row.name"></p>
                            </header>
                            <div>
                              <pre x-text="row.service.stderr.join('\n')"></pre>
                            </div>
                            <footer>
                              <button type="button" class="outline"
                                      @click="$el.closest('dialog').close()">Close</button>
                            </footer>
                          </dialog>
                        </span>
                      </template>
                    </span>
                  </template>
                </td>

                <td>
                  <template x-if="!row.service">
                    <span class="text-light">no launchd service</span>
                  </template>
                  <template x-if="row.service && row.service.unmanaged">
                    <span>
                      <span class="badge" data-variant="warning">unmanaged</span>
                      served by <code x-text="row.service.unmanaged.command"></code>
                      <span x-text="'pid ' + row.service.unmanaged.pid"></span>
                      <span class="text-light" x-text="'· service ' + row.service.short + ' stopped'"></span>
                    </span>
                  </template>
                  <template x-if="row.service && !row.service.unmanaged">
                    <span>
                      <template x-if="row.service.pid !== null">
                        <span>
                          <span class="badge" data-variant="success">running</span>
                          <span x-text="'pid ' + row.service.pid"></span>
                        </span>
                      </template>
                      <template x-if="row.service.pid === null">
                        <span>
                          <span class="badge" data-variant="danger">stopped</span>
                          <span x-show="row.service.lastExitStatus != null"
                                x-text="'exit ' + row.service.lastExitStatus"></span>
                        </span>
                      </template>
                      <span class="text-light" x-text="'· ' + row.service.short"></span>
                    </span>
                  </template>
                </td>

                <td>
                  <template x-if="data.canManage && row.port != null">
                    <label :title="row.published ? 'public — click to make private' : 'private — click to publish'">
                      <input type="checkbox"
                             role="switch"
                             :checked="row.published"
                             @change="onPublish(row)"
                             :aria-label="row.published ? 'make ' + row.name + ' private' : 'publish ' + row.name">
                    </label>
                  </template>
                </td>

                <td>
                  <template x-if="data.canManage && row.port != null">
                    <!-- Two glyphs, no text: the column stays narrow, and the
                         full sentence rides both title and aria-label so it is
                         reachable by hover and by screen reader. The modal is
                         one click away for anyone who wants more than a
                         glance. Cloudflare sync failures are NOT shown here:
                         the site cell already renders every row.issues entry,
                         with the failure message attached. -->
                    <button type="button" class="small ghost"
                            @click="openAccess(row)"
                            :title="accessSummary(row)"
                            :aria-label="accessSummary(row) + ', change access'">
                      <i data-lucide="lock-keyhole"
                         :class="row.hasPassword ? '' : 'text-lighter'"></i>
                      <i data-lucide="user-round-check"
                         :class="row.oauth && row.oauth.mode !== 'off' ? '' : 'text-lighter'"></i>
                    </button>
                  </template>
                </td>

                <td class="align-right">
                  <!-- One flex row around every control in this cell. The edit
                       and remove pair is itself a flex container, so as a bare
                       sibling of the restart button it forced its own line and
                       dropped under the access cell's controls. -->
                  <span class="hstack gap-1 justify-end">
                    <button type="button"
                            x-show="data.canRestart && row.service"
                            class="small outline"
                            :disabled="isRestarting(row)"
                            @click="onRestart(row)"
                            :aria-label="row.service ? 'restart ' + row.service.short : 'restart service'">
                      <i data-lucide="refresh-cw"></i>
                    </button>
                    <template x-if="data.canManage && row.managedBy === 'user'">
                      <span class="hstack gap-1">
                        <button type="button" class="small outline"
                                @click="openEdit(row)" :aria-label="'edit ' + row.name">
                          <i data-lucide="pencil"></i>
                        </button>
                        <button type="button" class="small outline" data-variant="danger"
                                @click="onRemove(row)" :aria-label="'remove ' + row.name">
                          <i data-lucide="trash-2"></i>
                        </button>
                      </span>
                    </template>
                  </span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <section x-show="tunnels.length" class="mt-6">
    <h2>cloudflare tunnel</h2>
    <div class="table">
      <table>
        <tbody>
          <template x-for="row in tunnels" :key="row.name">
            <tr>
              <td>
                <strong>Cloudflare tunnel</strong>
                <span class="text-light" x-text="row.name"></span>
              </td>
              <td>
                <template x-if="isRestarting(row)">
                  <span class="badge" data-variant="warning">
                    <span aria-busy="true" data-spinner="small" aria-hidden="true"></span>
                    restarting…
                  </span>
                </template>
                <template x-if="!isRestarting(row)">
                  <span class="badge"
                        :data-variant="row.service && row.service.pid !== null ? 'success' : 'danger'"
                        :title="row.service && row.service.pid !== null ? 'tunnel running' : 'tunnel stopped'"
                        x-text="row.service && row.service.pid !== null ? 'up' : 'down'"></span>
                </template>
              </td>
              <td>
                <template x-if="row.service && row.service.pid !== null">
                  <span>
                    <span class="badge" data-variant="success">running</span>
                    <span x-text="'pid ' + row.service.pid"></span>
                  </span>
                </template>
                <template x-if="!row.service || row.service.pid === null">
                  <span>
                    <span class="badge" data-variant="danger">stopped</span>
                    <span x-show="row.service && row.service.lastExitStatus != null"
                          x-text="'exit ' + (row.service ? row.service.lastExitStatus : '')"></span>
                  </span>
                </template>
                <!-- Locally there is no public domain to name, and "carries *."
                     with a dangling dot is worse than saying nothing. -->
                <span class="text-light" x-show="tunnelDomain()"
                      x-text="'carries *.' + tunnelDomain()"></span>
              </td>
              <td class="align-right">
                <button type="button"
                        x-show="data.canRestart && row.service"
                        class="small outline"
                        :disabled="isRestarting(row)"
                        @click="onRestart(row)"
                        aria-label="restart tunnel">
                  <i data-lucide="refresh-cw"></i>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>

  <template x-if="addModal">
    <dialog closedby="any"
            x-init="$nextTick(() => { $el.showModal(); $el.querySelector('[name=app-name]').focus(); })"
            @close="addModal = null" @cancel="addModal = null">
      <form @submit.prevent="submitAdd()">
        <header>
          <h3>Add an app</h3>
          <p>Registers a local service: a named https domain, and (unless it runs itself) a supervised process that starts on login.</p>
        </header>
        <div class="vstack gap-3">
          <!-- The switch comes first in markup so its wrapping label -- the one
               Oat needs :title on to render the thumb -- is never preceded by
               an unrelated data-field label; see board-assets.test.ts. -->
          <label class="hstack gap-2"
                 :title="addModal.external ? 'runs itself — Local only routes a port to it' : 'Local runs it via launchd'">
            <input type="checkbox" role="switch" x-model="addModal.external"
                   :aria-label="addModal.external ? 'stop routing only, let Local run this app' : 'route only — this app runs itself'">
            <span>I run this myself — just route a port</span>
          </label>
          <!-- span, not label: accessModal's dialog sits after this one in the
               file (a hard requirement, see its own note below), so a label
               here would be read as ITS switches' wrapper by the same guard. -->
          <span data-field>
            Name
            <input name="app-name" x-model="addModal.name" placeholder="myapp" required
                   pattern="[a-z0-9][a-z0-9.-]*" title="lowercase letters, digits, dots, dashes"
                   aria-label="Name">
          </span>
          <template x-if="!addModal.external">
            <span class="vstack gap-3">
              <span data-field>
                Command
                <input x-model="addModal.command" placeholder="bun src/server.ts" required aria-label="Command">
              </span>
              <span data-field>
                Working directory
                <input x-model="addModal.workingDirectory" placeholder="/Users/you/code/myapp" required aria-label="Working directory">
              </span>
              <p class="text-light" x-show="data && data.nextPort"
                 x-text="'Will be assigned port ' + (data ? data.nextPort : '') + ' (PORT env).'"></p>
            </span>
          </template>
          <template x-if="addModal.external">
            <span data-field>
              Port it listens on
              <input x-model="addModal.staticPort" inputmode="numeric" placeholder="4200" required aria-label="Port it listens on">
            </span>
          </template>
          <p role="alert" data-variant="error" x-show="addModal.error" x-text="addModal.error"></p>
        </div>
        <footer>
          <button type="button" class="outline" @click="addModal = null">Cancel</button>
          <button type="submit">Add app</button>
        </footer>
      </form>
    </dialog>
  </template>

  <template x-if="editModal">
    <dialog closedby="any"
            x-init="$nextTick(() => $el.showModal())"
            @close="editModal = null" @cancel="editModal = null">
      <form @submit.prevent="submitEdit()">
        <header><h3 x-text="'Edit ' + editModal.original"></h3></header>
        <div class="vstack gap-3">
          <!-- span, not label: same reason as addModal above. -->
          <span data-field>Name
            <input x-model="editModal.name" pattern="[a-z0-9][a-z0-9.-]*" required aria-label="Name">
          </span>
          <span data-field>Base port
            <input x-model="editModal.port" inputmode="numeric" required aria-label="Base port">
          </span>
          <template x-if="editModal.kind === 'service'">
            <span class="vstack gap-3">
              <span data-field>Command <input x-model="editModal.command" required aria-label="Command"></span>
              <span data-field>Working directory <input x-model="editModal.workingDirectory" required aria-label="Working directory"></span>
            </span>
          </template>
          <p role="alert" data-variant="error" x-show="editModal.error" x-text="editModal.error"></p>
        </div>
        <footer>
          <button type="button" class="outline" @click="editModal = null">Cancel</button>
          <button type="submit">Save</button>
        </footer>
      </form>
    </dialog>
  </template>

  <!-- Last block on the page by requirement, not by accident: the switch guard
       in board-assets.test.ts scans left to right, so a label sitting between
       two switches is read as the later switch's wrapper. The radio labels
       below are safe only while no switch follows them. That same reasoning
       is why every data-field above this point (in addModal and editModal)
       is a span rather than a label: this dialog's switches now sit after
       them too. -->
  <template x-if="accessModal">
    <dialog closedby="any"
            x-init="$nextTick(() => $el.showModal())"
            @close="accessModal = null" @cancel="accessModal = null">
      <header>
        <h3 x-text="'Access · ' + accessModal.app"></h3>
        <p x-show="accessModal.published"
           x-text="'Published at ' + accessModal.publicUrl"></p>
        <p x-show="!accessModal.published">Not published. These gates apply once it is.</p>
      </header>
      <div class="vstack gap-4">

        <section class="vstack gap-2">
          <label class="hstack gap-2"
                 :title="accessModal.hasPassword
                   ? 'a password is required, click to remove it'
                   : 'no password, click to set one'">
            <input type="checkbox" role="switch"
                   :checked="accessModal.hasPassword || accessModal.pwOpen"
                   @change="onPasswordSwitch()"
                   :aria-label="accessModal.hasPassword ? 'remove the password' : 'require a password'">
            <span>Password protected</span>
          </label>
          <!-- x-show, not a nested template x-if: a nested template's own
               closing tag would give the dialog test's lazy match a false
               stopping point before it reaches this whole dialog's real end. -->
          <span class="vstack gap-2" x-show="accessModal.hasPassword || accessModal.pwOpen">
            <p class="text-light" x-show="accessModal.hasPassword">
              A password is set. Changing it signs out anyone holding a session.
            </p>
            <span class="hstack gap-2">
              <!-- span, not label: see the note at the top of this block. -->
              <span data-field class="mb-0">
                <input type="password" x-model="accessModal.password"
                       placeholder="new password" aria-label="new password">
              </span>
              <button type="button" class="small"
                      :disabled="!accessModal.password || accessModal.pwBusy"
                      @click="savePassword()"
                      x-text="accessModal.hasPassword ? 'Change' : 'Set'"></button>
            </span>
            <p role="alert" data-variant="error"
               x-show="accessModal.pwError" x-text="accessModal.pwError"></p>
          </span>
        </section>

        <section class="vstack gap-2">
          <label class="hstack gap-2"
                 :title="accessModal.oauthOn
                   ? 'google sign-in is required, click to turn it off'
                   : 'no sign-in gate, click to require google'">
            <input type="checkbox" role="switch"
                   :checked="accessModal.oauthOn"
                   @change="onOauthSwitch()"
                   :aria-label="accessModal.oauthOn ? 'turn google sign-in off' : 'require google sign-in'">
            <span>Google sign-in</span>
          </label>
          <!-- x-show, not a nested template x-if: see the note on the
               password panel above. -->
          <span class="vstack gap-2" x-show="accessModal.oauthOn">
            <p class="text-light">
              Visitors sign in with Google at Cloudflare's edge before reaching the app.
            </p>
            <label class="hstack gap-2">
              <input type="radio" name="oauth-mode" value="domains" x-model="accessModal.mode">
              <span>Anyone at these domains</span>
            </label>
            <label class="hstack gap-2">
              <input type="radio" name="oauth-mode" value="emails" x-model="accessModal.mode">
              <span>These people</span>
            </label>
            <span class="hstack gap-2">
              <span data-field class="mb-0">
                <input x-model="accessModal.list"
                       :placeholder="accessModal.mode === 'emails' ? 'a@x.dev, b@y.dev' : 'corp.com, other.dev'"
                       :aria-label="accessModal.mode === 'emails' ? 'allowed emails' : 'allowed domains'">
              </span>
              <button type="button" class="small"
                      :disabled="!accessModal.list.trim() || accessModal.oauthBusy"
                      @click="applyOauth()">Apply</button>
            </span>
            <p role="alert" data-variant="error"
               x-show="accessModal.oauthError" x-text="accessModal.oauthError"></p>
          </span>
        </section>

      </div>
      <footer>
        <button type="button" class="outline" @click="accessModal = null">Done</button>
      </footer>
    </dialog>
  </template>
