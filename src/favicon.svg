<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- console's web recipe, verbatim: 32-unit tile, squircle rx=7.2, pink
       tile + dark glyph (the inversion that pops at 16px, vs mattstack.app's
       own dark-tile/pink-glyph native icon). See rt chat #mantine-tokyo for
       the "why": meg's make-icon.swift measurements and the console
       comparison that flagged the old thin-stroke branch diagram as mushy
       at header size. -->
  <rect width="32" height="32" rx="7.2" fill="#ff84ad"/>
  <!-- Board pictograph: three kanban columns (bold solid fills, not thin
       strokes, which go mushy under 30px). Uneven heights read as "a
       board with cards in it" rather than a generic bar chart. -->
  <rect x="7.25" y="6" width="4.5" height="19" rx="2.2" fill="#1d1830"/>
  <rect x="13.75" y="13" width="4.5" height="12" rx="2.2" fill="#1d1830"/>
  <rect x="20.25" y="9" width="4.5" height="16" rx="2.2" fill="#1d1830"/>
</svg>
