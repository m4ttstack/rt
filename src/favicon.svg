<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- console's web recipe: 32-unit tile, squircle rx=7.2, pink tile / dark
       glyph. Merge pictograph (not the bar-chart one this replaced): one
       color, bold nodes and stroke, no separate arrowhead so nothing reads
       as a disconnected fleck at 16px. -->
  <rect width="32" height="32" rx="7.2" fill="#ff84ad"/>
  <circle cx="22" cy="7" r="4" fill="#1d1830"/>
  <line x1="22" y1="11" x2="22" y2="21" stroke="#1d1830" stroke-width="5" stroke-linecap="round"/>
  <circle cx="22" cy="25" r="4" fill="#1d1830"/>
  <circle cx="8" cy="25" r="4" fill="#1d1830"/>
  <path d="M8 21 V17 Q8 12 13 12 H22" fill="none" stroke="#1d1830" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
